[package]
name = "m4h-platform"
description = "The Platform trait: everything M4H applications ask of the system, with a Linux backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["platform", "multikernel", "no-std", "numa"]
categories = ["os", "no-std"]

[features]
default = ["linux"]
## Linux hosted backend. Only takes effect when compiling for Linux; on other
## targets (e.g. x86_64-unknown-none) the crate stays no_std and dependency-free.
linux = ["dep:libc"]

[dependencies]
m4h-ring = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[lints]
workspace = true
