name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build, test and docs
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  no-std:
    name: no_std build (x86_64-unknown-none)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --target x86_64-unknown-none
          -p m4h -p m4h-ring -p m4h-platform -p m4h-kernel -p m4h-net

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.85 build --workspace --all-targets
      - run: cargo +1.85 test --workspace

  miri:
    name: Miri on m4h-ring (${{ matrix.borrows }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - borrows: stacked borrows
            flags: ""
          - borrows: tree borrows
            flags: -Zmiri-tree-borrows
    env:
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p m4h-ring

  loom:
    name: loom model checking of m4h-ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: model check the protocol
        run: cargo test -p m4h-ring --test loom --release
        env:
          RUSTFLAGS: --cfg loom -D warnings
      - name: negative test (Relaxed publish must be caught)
        run: cargo test -p m4h-ring --test loom --release relaxed_publish_is_caught
        env:
          RUSTFLAGS: --cfg loom --cfg m4h_ring_broken_release
