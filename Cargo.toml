[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/axellettieri/m4h"
homepage = "https://github.com/axellettieri/m4h"
authors = ["Axel Lettieri"]

[workspace.dependencies]
m4h-ring = { path = "crates/m4h-ring" }
m4h-platform = { path = "crates/m4h-platform" }
m4h-net = { path = "crates/m4h-net" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"
